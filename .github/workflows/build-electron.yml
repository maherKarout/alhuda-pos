name: Build Electron App

on:
  push:
    branches: [dev]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm run build

      - name: Build Electron exe
        run: pnpm run electron:build

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: electron-exe
          path: dist/
