  name: Build Electron App

  on:
    push:
      branches: [dev]
    pull_request:
      branches: [dev]

  jobs:
    build:
      runs-on: windows-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup pnpm
          uses: pnpm/action-setup@v4
          with:
            version: 10

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
            cache: 'pnpm'

        - name: Install dependencies
          run: pnpm install

        - name: Build frontend
          run: pnpm run build

        - name: Build Electron
          run: pnpm run build:win

        # Optional: Debug what was built
        - name: Check releases folder
          run: |
            echo "=== Checking releases folder ==="
            if (Test-Path releases) {
              Get-ChildItem -Path releases -Recurse | Format-Table Name, FullName, Length
            } else {
              echo "ERROR: releases folder not found!"
              echo "Checking current directory:"
              Get-ChildItem | Format-Table Name, Mode
            }

        # ✅ FIXED: Upload from releases folder
        - name: Upload artifacts
          uses: actions/upload-artifact@v4
          with:
            name: electron-app-windows
            path: |
              releases/**/*.exe
              releases/**/*.blockmap
              releases/**/*.msi
            retention-days: 7