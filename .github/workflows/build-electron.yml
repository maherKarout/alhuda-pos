name: Build Electron App

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ Setup Node.js with npm cache
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      # ✅ Install dependencies using npm
      - name: Install dependencies
        run: npm ci

      # ✅ Build frontend
      - name: Build frontend
        run: npm run build

      # ✅ Build Electron
      - name: Build Electron
        run: npm run build:win

      # Optional: Debug what was built
      - name: Check releases folder
        run: |
          echo "=== Checking releases folder ==="
          if (Test-Path releases) {
            Get-ChildItem -Path releases -Recurse | Format-Table Name, FullName, Length
          } else {
            echo "ERROR: releases folder not found!"
            echo "Checking current directory:"
            Get-ChildItem | Format-Table Name, Mode
          }

      # ✅ Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-app-windows
          path: |
            releases/**/*.exe
            releases/**/*.blockmap
            releases/**/*.msi
          retention-days: 7
