name: Build Electron App

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ⚠️ SETUP PNPM FIRST!
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      # Then setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24  # Use 20 instead of 24 for better compatibility
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Build Electron exe
        run: pnpm run electron:build

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: electron-exe
          path: dist/
