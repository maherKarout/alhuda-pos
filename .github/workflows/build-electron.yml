name: Build Electron App

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4
      
      # 2. SETUP PNPM FIRST! ⭐
      - uses: pnpm/action-setup@v2
        with:
          version: 8
          
      # 3. Setup Node.js (with pnpm cache support)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          
      # 4. Install dependencies
      - run: pnpm install
      
      # 5. Build steps
      - run: pnpm run build
      - run: pnpm run electron:build
      
      # 6. Upload
      - uses: actions/upload-artifact@v4
        with:
          name: alhuda-pos-windows
          path: dist/*.exe
