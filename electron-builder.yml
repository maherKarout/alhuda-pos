appId: com.alhuda.pos
productName: Al Huda POS

# Optional global icon (use platform-specific icons below for best results)
icon: build/icon

directories:
  output: releases
  buildResources: build

files:
  - 'out/**'
  - 'package.json'
  - 'resources/**'
  - 'src/generated/client/**/*' # Include your new custom client folder

asarUnpack:
  - 'node_modules/better-sqlite3/**/*'
  # Unpack the engine so it can actually run
  - 'node_modules/.prisma/client/query-engine-*.exe'
  - 'node_modules/.prisma/client/*.dll.node'

extraResources:
  - from: prisma/schema.prisma
    to: prisma/schema.prisma
  - from: prisma/migrations
    to: prisma/migrations

