appId: com.alhuda.pos
productName: Al Huda POS

# Optional global icon (use platform-specific icons below for best results)
icon: build/icon

directories:
  output: releases
  buildResources: build

files:
  # Only include the out folder and package.json
  - 'out/**'
  - 'package.json'
  - 'resources/**'

  # Exclude all other folders and files
  - '!src/**'
  - '!dist/**'
  - 'node_modules/**'
  - '!releases/**'
  - '!sqlite.db'
  - '!**/.vscode/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

# Include resources folder outside of asar for icon access
asarUnpack:
  - resources/**

win:
  executableName: AlHudaPOS
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  deleteAppDataOnUninstall: true

mac:
  target:
    - dmg
    - zip
  icon: build/icon.icns
  category: public.app-category.utilities
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false

dmg:
  artifactName: ${name}-${version}.${ext}

linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility

appImage:
  artifactName: ${name}-${version}.${ext}

npmRebuild: false

# Publishing configuration
# Choose one of the following options:

# Option 1: GitHub Releases (Recommended for open-source projects)
# publish:
#   provider: github
#   owner: your-github-username
#   repo: your-repo-name
#   releaseType: release

# Option 2: Generic HTTP Server (for custom server)
publish:
  provider: generic
  url: http://127.0.0.1:5500/
  # Place your update files at: https://example.com/auto-updates/latest.yml
  # and https://example.com/auto-updates/YourApp-Setup-1.0.0.exe
# Option 3: Amazon S3
# publish:
#   provider: s3
#   bucket: your-bucket-name
#   region: us-east-1

# Option 4: Multiple providers
# publish:
#   - provider: github
#     owner: your-username
#     repo: your-repo
#   - provider: generic
#     url: https://your-server.com/updates
